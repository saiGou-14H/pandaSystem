server:
  port: 9999
spring:
  application:
    name: gateway-9999
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://127.0.0.1:3306/scnu?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&allowMultiQueries=true&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: 70852096
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  main:
    web-application-type: reactive
  cloud:
    nacos:
      server-addr: scnu.saigou.work:8848
      discovery:
        group: pandaSystem
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedHeaders: "*"
            allowedMethods: "*"
      discovery:
        locator:
          # 根据注册中心的服务自动生成路由
          enabled: true
          # 路由名转小写
          lower-case-service-id: true
      routes:
        - id: user-consumer-9001
          uri: lb://user-consumer-9001
          predicates:
            - Path=/auth/**,/user/**
        - id: room-consumer-9002
          uri: lb://room-consumer-9002
          predicates:
            - Path=/room/**
        - id: course-consumer-9005
          uri: lb://course-consumer-9005
          predicates:
            - Path=/course/**
        - id: control-consumer-9007
          uri: lb://control-consumer-9007
          predicates:
            - Path=/control/**
        - id: analyzer-server-10001
          uri: lb://analyzer-server-10001
          predicates:
            - Path=/analyzer/**
        - id: ws-analyzer-server-10001
          uri: lb:ws://analyzer-server-10001
          predicates:
            - Path=/ws/**
        - id: media-server-10000
          uri: lb://media-server-10000
          predicates:
            - Path=/media/**
auth:
  excludePaths:
    - /auth/**
    - /room-consumer-9002/**
    - /room-provider-9003/**
    - /user-consumer-9001/**
    - /user-provider-9000/**
    - /course-consumer-9005/**
    - /course-provider-9004/**
    - /control-consumer-9007/**
    - /control-provider-9006/**
    - /analyzer-server-10001/**
    - /media-server-10000/**
    - /ws/**

  jwt:
    secret: 70852096
custom:
  info:
    title: 熊猫
    version: 1.0
    description: 基于深度学习的课堂监控系统
    # 设置当前服务在网关中的代理路径
    gateway-url: http://localhost:9999/${spring.application.name}
  license:
    name: ${spring.application.name}-api
    terms-of-service: http://localhost:${server.port}/swagger-ui.html
  security:
    name: Authenticate
    token-url: http://kwqqr48rgo.cdhttp.cn/oauth2/token
    authorization-url: http://kwqqr48rgo.cdhttp.cn/oauth2/authorize


