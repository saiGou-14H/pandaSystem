server:
  port: 10001
media:
  host: 127.0.0.1
  rtmp_port: 7935
  rtsp_port: 7554
  http_port: 7080
  rtc_port: 8000
spring:
  application:
    name: analyzer-server-10001
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://127.0.0.1:3306/scnu?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&allowMultiQueries=true&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: 70852096
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  cloud:
    nacos:
      server-addr: scnu.saigou.work:8848
      discovery:
        group: pandaSystem
    stream:
      bindings:
        output:
          destination: analyzer_topic #消息发往的目的地
          content-type: application/json #消息发送的格式，这里使用 text。发送字符串消息的时候需要配置，默认是 json格式 text/plain
        input:
          destination: analyzer_topic #目的地
          group: analyzer_consumer_group #消费者分组
      default-binder: kafka
      kafka:
        binder:
          brokers: scnu.saigou.work:7777
          auto-create-topics: true #设置自动创建Topic
          required-acks: 1 # 0-不等待任何确认。1-等待 leader 应答（默认）。all-等待所有 leader 和 follower 应答。
          # Binding 配置项，对应 BindingProperties Map

config:
  pull:
    maxImageWidth: 1920
    maxImageHeight: 1080
    rtsp_transport: tcp
    hwaccel: auto
    hwaccel_device: gpu
  push:
    recorder:
      video-option:
        tune: zerolatency    # 零延迟模式
        preset: ultrafast    # 快速编码
        crf: 23              # 画质与码率平衡
        quality: speed   # 快速编码
        rc: cbr_ld_hq        # 低延迟码率控制
        usage: ultralowlatency # 超低延迟模式
        threads: 8             # 线程数
        rtbufsize: 2048K       # 缓冲区大小
        max_delay: 500000      # 最大延迟（微秒）
        reconnect: 1           # 启用自动重连
        reconnect_at_eof: 1    # 在EOF时重连
        reconnect_streamed: 1  # 流式重连
  analyzer:
    maxInboundMessageSize: 104857600 #100M 100*1024*1024
    server:
      - host: localhost
        port: 50051
custom:
  info:
    title: 熊猫
    version: 1.0
    description: 基于深度学习的课堂监控系统
    contact: 基于深度学习的课堂监控系统
    # 设置当前服务在网关中的代理路径
    gateway-url: http://localhost:9999/${spring.application.name}
  license:
    name: ${spring.application.name}-api
    terms-of-service: http://localhost:${server.port}/swagger-ui.html
  security:
    name: Authenticate
    token-url: http://kwqqr48rgo.cdhttp.cn/oauth2/token
    authorization-url: http://kwqqr48rgo.cdhttp.cn/oauth2/authorize
mybatis-plus:
  configuration:
    default-executor-type: batch # 启用批量模式
  global-config:
    db-config:
      logic-delete-field: is_deleted # 确认无冲突配置
logging:
  level:
    com.baomidou.mybatisplus: debug
    org.springframework.jdbc.core.JdbcTemplate: debug